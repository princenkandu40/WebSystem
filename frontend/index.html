<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prince Nkandu - Tech Product Showcase</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="header-content">
            <h1>Tech Product Showcase</h1>
            <p>Manage your technology products in one place</p>
            <p class="student-details"><strong>Prince Nkandu</strong>-<strong>202506829</strong></p>
        </div>
    </header>

    <main>
        <section class="form-section">
            <h2 id="form-title">Add a New Product</h2>

            <form id="product-form">
                <input type="hidden" id="product-id">

                <div class="form-grid">
                    <div class="form-group">
                        <label for="name">Product Name</label>
                        <input type="text" id="name" placeholder="e.g. Dell Monitor" required>
                    </div>

                    <div class="form-group">
                        <label for="category">Category</label>
                        <input type="text" id="category" placeholder="e.g. Accessories" required>
                    </div>

                    <div class="form-group">
                        <label for="price">Price (ZMW)</label>
                        <input type="number" id="price" min="0" step="0.01" placeholder="0.00" required>
                    </div>

                    <div class="form-group">
                        <label for="brand">Brand</label>
                        <input type="text" id="brand" placeholder="e.g. Dell" required>
                    </div>

                    <div class="form-group">
                        <label for="stock">Stock Quantity</label>
                        <input type="number" id="stock" min="0" step="1" placeholder="0" required>
                    </div>

                    <div class="form-group full-width">
                        <label for="description">Description</label>
                        <input type="text" id="description" placeholder="Brief details about the product...">
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" id="submit-button">Add Product</button>
                    <button type="button" id="cancel-button" hidden>Cancel Edit</button>
                </div>
            </form>

            <p id="message" role="status"></p>
        </section>

        <section class="products-section">
            <h2>Available Products</h2>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Product Name</th>
                            <th>Category</th>
                            <th>Price (ZMW)</th>
                            <th>Brand</th>
                            <th>Stock</th>
                            <th>Description</th>
                            <th>Actions</th>
                        </tr>
                    </thead>

                    <tbody id="products-list">
                        <tr>
                            <td colspan="8" class="loading-text">Loading products...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Prince Nkandu - 202506829 Tech Product Showcase</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
